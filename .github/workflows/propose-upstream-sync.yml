name: Propose Upstream Sync

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official release tag; blank selects the latest stable release"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: propose-upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out maintenance source with repository deploy key
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release and check existing proposal
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --repo Wei-Shaw/sub2api --json tagName --jq '.tagName')"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid official release tag' >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          proposal="$(gh pr list --head "custom/$tag" --base "release/$tag" --state all --json url --jq '.[0].url // empty')"
          if [[ -n "$proposal" ]]; then
            echo "existing=true" >> "$GITHUB_OUTPUT"
            echo "Existing review (open, closed or merged): $proposal" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare official release plus feature patches
        if: steps.release.outputs.existing != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/Wei-Shaw/sub2api.git "refs/tags/$TAG:refs/tags/upstream/$TAG"
          python tools/downstream/prepare_release.py \
            --upstream-ref "refs/tags/upstream/$TAG" --upstream-tag "$TAG" \
            --source-ref HEAD --output "$RUNNER_TEMP/downstream-release.json"

      - name: Publish immutable review branches
        if: steps.release.outputs.existing != 'true'
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/downstream-release.json"
          base="$(jq -r .base_branch "$metadata")"
          candidate="$(jq -r .candidate_branch "$metadata")"
          base_sha="$(jq -r .base_sha "$metadata")"
          candidate_sha="$(jq -r .candidate_sha "$metadata")"
          # A retry after a PR API failure must preserve existing review work.
          base_existing="$(git ls-remote --heads origin "refs/heads/$base")"
          candidate_existing="$(git ls-remote --heads origin "refs/heads/$candidate")"
          if [[ -z "$base_existing" && -z "$candidate_existing" ]]; then
            git push --atomic origin "$base_sha:refs/heads/$base" "$candidate_sha:refs/heads/$candidate"
          elif [[ -z "$base_existing" || -z "$candidate_existing" ]]; then
            echo 'Only one review branch exists; inspect before retrying.' >&2
            exit 1
          else
            echo 'Reusing existing version branches without overwriting them.'
          fi

      - name: Create review-only pull request
        if: steps.release.outputs.existing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/downstream-pr.md"
          python - "$RUNNER_TEMP/downstream-release.json" "$body" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          patches = '\n'.join('- ' + p['id'] for p in data['patches'])
          pathlib.Path(sys.argv[2]).write_text(
              f"Official baseline: `{data['upstream_tag']}` (`{data['upstream_commit']}`).\n\n"
              "This candidate starts from that official release and reapplies only the maintained feature patches. "
              "The base branch already contains separate maintenance files, so this PR highlights application changes.\n\n"
              f"Feature patches:\n{patches}\n\n"
              "Review CI and Security Scan before merging into this version's release branch. "
              "The SSH-pushed candidate triggers push checks independently of PR approval. "
              "Merging does not build or deploy an image; publish an explicit dai-v tag after review.\n"
          )
          PY
          url="$(gh pr create --base "release/$TAG" --head "custom/$TAG" \
            --title "Apply downstream features to Sub2API $TAG" --body-file "$body")"
          echo "Review proposal: $url" >> "$GITHUB_STEP_SUMMARY"
