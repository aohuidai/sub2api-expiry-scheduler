name: Propose Upstream Sync

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official release tag to merge; leave blank for the latest release"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: propose-upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out custom main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve official release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --repo Wei-Shaw/sub2api --json tagName --jq '.tagName')"
          fi
          git check-ref-format --allow-onelevel "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Fetch selected official release
        id: upstream
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git 2>/dev/null || true
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/upstream/$TAG"
          if git merge-base --is-ancestor "upstream/$TAG" origin/main; then
            echo "already_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an existing proposal
        id: existing
        if: steps.upstream.outputs.already_current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          branch="sync/upstream-$TAG"
          url="$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url')"
          if [[ -n "$url" ]]; then
            echo "already_open=true" >> "$GITHUB_OUTPUT"
            echo "Existing proposal: $url"
          else
            echo "already_open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge official release into a proposal branch
        if: steps.upstream.outputs.already_current != 'true' && steps.existing.outputs.already_open != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          branch="sync/upstream-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch" origin/main
          if ! git merge --no-ff --no-commit "upstream/$TAG"; then
            git merge --abort || true
            echo "The custom patch conflicts with upstream $TAG. Resolve it locally, then open the sync PR manually." >&2
            exit 1
          fi
          git commit -m "chore(upstream): merge $TAG"
          git push --force-with-lease origin "$branch"

      - name: Open a review-only pull request
        if: steps.upstream.outputs.already_current != 'true' && steps.existing.outputs.already_open != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          branch="sync/upstream-$TAG"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(upstream): merge $TAG" \
            --body "Automated proposal to merge the official Sub2API release \`$TAG\` into the custom fork.\n\nThis PR is intentionally not auto-merged or deployed. Review the custom scheduler tests and the upstream diff before merging."
