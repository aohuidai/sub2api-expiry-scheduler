name: Build Custom Image

on:
  push:
    tags:
      - "dai-v*"
  pull_request:
    types: [closed]
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-image-publication
  cancel-in-progress: false

jobs:
  resolve-release:
    if: github.event.deleted != true && (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      runtime_version: ${{ steps.release.outputs.runtime_version }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Select reviewed source and derive version tags
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/downstream/image_release.py --output "$GITHUB_OUTPUT"

  build-arm64:
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the exact reviewed merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.resolve-release.outputs.image_tag }}
            ghcr.io/${{ github.repository }}:sha-${{ needs.resolve-release.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve-release.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.resolve-release.outputs.image_tag }}
          build-args: |
            VERSION=${{ needs.resolve-release.outputs.runtime_version }}
            COMMIT=${{ needs.resolve-release.outputs.source_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
