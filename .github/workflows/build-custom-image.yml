name: Build Custom Image

on:
  push:
    tags:
      - "dai-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        default: "main"
        type: string
      image_tag:
        description: "Pinned GHCR image tag, for example dai-v0.2.13.1"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image-${{ inputs.image_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve image tag
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            image_tag="$REF_NAME"
          else
            image_tag="$INPUT_TAG"
          fi
          if [[ ! "$image_tag" =~ ^dai-v([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            echo "Custom image tags must use dai-vX.Y.Z.N, for example dai-v0.2.13.1" >&2
            exit 1
          fi
          runtime_version="${BASH_REMATCH[1]}-dai.${BASH_REMATCH[2]}"
          upstream_version="${BASH_REMATCH[1]}"
          python - "$upstream_version" <<'PY'
          import json, pathlib, sys
          metadata = json.loads(pathlib.Path('DOWNSTREAM_RELEASE.json').read_text())
          if metadata['upstream_tag'] != 'v' + sys.argv[1]:
              raise SystemExit('Image tag does not match the prepared official baseline')
          PY
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "runtime_version=$runtime_version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }}
            ghcr.io/${{ github.repository }}:sha-${{ steps.image.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
          build-args: |
            VERSION=${{ steps.image.outputs.runtime_version }}
            COMMIT=${{ steps.image.outputs.source_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
